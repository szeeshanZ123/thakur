<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Captain's Treasure Ledger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, #152238 0%, var(--bg-primary) 80%);
      padding: 1.5rem;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      box-shadow: var(--shadow-xl), 0 0 40px rgba(212, 163, 89, 0.08);
      position: relative;
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--color-gold), var(--color-gold-dark));
      color: var(--bg-primary);
      margin-bottom: 1rem;
      box-shadow: 0 0 20px rgba(212, 163, 89, 0.3);
    }
    .login-title {
      font-family: var(--font-heading);
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--color-gold-light);
      margin-bottom: 0.25rem;
    }
    .login-subtitle {
      font-size: 0.88rem;
      color: var(--text-muted);
    }
    .demo-roles-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border-subtle);
    }
    .demo-role-btn {
      padding: 0.6rem 0.4rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 0.78rem;
      cursor: pointer;
      text-align: center;
      transition: all var(--transition-fast);
    }
    .demo-role-btn:hover {
      border-color: var(--color-gold);
      background: rgba(212, 163, 89, 0.1);
      transform: translateY(-1px);
    }
    .demo-role-btn strong {
      display: block;
      color: var(--color-gold);
      font-size: 0.82rem;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <div class="login-logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M15.5 8.5l-2 5-5 2 2-5 5-2z"/></svg>
      </div>
      <h1 class="login-title">Captain's Treasure Ledger</h1>
      <p class="login-subtitle">Nautical Treasury & Dividend Distribution Engine</p>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="username">Pirate Handle / Email</label>
        <input type="text" id="username" class="form-control" placeholder="blackbeard@blackpearl.fleet" value="captain@blackpearl.fleet" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Treasury Key (Password)</label>
        <div style="position:relative;">
          <input type="password" id="password" class="form-control" placeholder="••••••••••••" value="tortuga_secret_key" required style="padding-right: 40px;">
          <button type="button" id="toggle-password" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text-muted); cursor:pointer;" aria-label="Toggle password visibility">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" id="btn-login-submit" style="width:100%; margin-top:1rem; padding:0.75rem;">
        Board Flagship (Sign In)
      </button>
    </form>

    <div class="demo-roles-grid">
      <button class="demo-role-btn" onclick="quickLogin('captain')">
        <strong>Captain</strong>
        Blackbeard
      </button>
      <button class="demo-role-btn" onclick="quickLogin('admin')">
        <strong>Admin</strong>
        Anne Bonny
      </button>
      <button class="demo-role-btn" onclick="quickLogin('crew')">
        <strong>Crew</strong>
        Israel Hands
      </button>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script>
    document.getElementById("toggle-password").addEventListener("click", () => {
      const pwd = document.getElementById("password");
      pwd.type = pwd.type === "password" ? "text" : "password";
    });

    function quickLogin(role) {
      Auth.setRole(role);
      showToast(`Welcome aboard, ${Auth.getUser().name}!`, "success");
      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 300);
    }

    document.getElementById("login-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const btn = document.getElementById("btn-login-submit");
      btn.disabled = true;
      btn.textContent = "Authenticating with Fleet...";

      const email = document.getElementById("username").value.toLowerCase();
      let role = "captain";
      if (email.includes("admin") || email.includes("bonny")) role = "admin";
      if (email.includes("crew") || email.includes("israel") || email.includes("hands")) role = "crew";

      setTimeout(() => {
        Auth.setRole(role);
        showToast("Authentication confirmed. Accessing treasury...", "success");
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 300);
      }, 400);
    });
  </script>
</body>
</html>
